<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
    <title>Sign in | Smart Login System</title>
</head>
<body>
    <main class="container my-5 text-center">
        <form id="signinForm" class="group m-auto p-4 p-md-5" novalidate>
            <h1 class="mb-4">Smart Login System</h1>

            <label class="visually-hidden" for="signinEmail">Email</label>
            <input id="signinEmail" class="form-control my-3" placeholder="Enter your email" type="email" autocomplete="email">

            <label class="visually-hidden" for="signinPassword">Password</label>
            <input id="signinPassword" class="form-control my-3" placeholder="Enter your password" type="password" autocomplete="current-password">

            <p id="incorrect" class="msg" role="alert"></p>

            <button type="submit" class="btn btn-outline-info w-100 my-3">Login</button>
            <p class="text-white mb-0">Don't have an account? <a class="text-white" href="signup.html">Sign up</a></p>
        </form>
    </main>
    <script src="js/index.js"></script>
</body>
</html>
