<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
    <title>Sign up | Smart Login System</title>
</head>
<body>
    <main class="container my-5 text-center">
        <form id="signupForm" class="group m-auto p-4 p-md-5" novalidate>
            <h1 class="mb-4">Smart Login System</h1>

            <label class="visually-hidden" for="signupName">Name</label>
            <input id="signupName" class="form-control my-3" placeholder="Enter your name" type="text" autocomplete="name">

            <label class="visually-hidden" for="signupEmail">Email</label>
            <input id="signupEmail" class="form-control my-3" placeholder="Enter your email" type="email" autocomplete="email">

            <label class="visually-hidden" for="signupPassword">Password</label>
            <input id="signupPassword" class="form-control my-3" placeholder="Enter password (at least 6 characters)" type="password" autocomplete="new-password">

            <p id="exist" class="msg" role="alert"></p>

            <button type="submit" class="btn btn-outline-info w-100 my-3">Sign up</button>
            <p class="text-white mb-0">Already have an account? <a class="text-white" href="index.html">Sign in</a></p>
        </form>
    </main>
    <script src="js/index.js"></script>
</body>
</html>
